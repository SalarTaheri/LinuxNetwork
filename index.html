      <header style="padding: 24px; text-align: center; border-bottom: 1px solid #1e293b;">
        <h1>LinuxNetwork.ir | جعبه‌ابزار جامع مهندسی شبکه و لینوکس</h1>
        <p>مجموعه ابزارهای تخصصی، متن‌باز و کلاینت‌ساید برای بهینه‌سازی کرنل لینوکس، ستاپ سرور و پیکربندی شبکه</p>
      </header>
      <main style="max-width: 900px; margin: 0 auto; padding: 24px; font-family: sans-serif; line-height: 1.8;">
        <h2>ابزارهای تخصصی موجود:</h2>
        <ul>
          <li>
            <a href="/?tool=setup"><strong>اسکریپت ستاپ سرور (setup.sh):</strong></a>
            ژنراتور وان‌لاینر Bash برای فعال‌سازی BBR، ایمن‌سازی SSH، فایروال Fail2ban و نصب داکر با میرورهای سریع ایرانی.
          </li>
          <li>
            <a href="/?tool=sysctl"><strong>بهینه‌ساز کرنل و استک شبکه (Sysctl Optimizer):</strong></a>
            تنظیمات حرفه‌ای /etc/sysctl.d/99-network-tuning.conf برای وب‌سرورها، تانل، بافرهای TCP و کنترل ازدحام BBR.
          </li>
          <li>
            <a href="/?tool=nginx"><strong>سازنده کانفیگ پروکسی معکوس انجین‌ایکس (Nginx Builder):</strong></a>
            پیکربندی ماژولار با پشتیبانی از ارتقای WebSocket، هدرهای امنیتی OWASP و گواهی SSL Let’s Encrypt.
          </li>
          <li>
            <a href="/?tool=wireguard"><strong>سازنده کانفیگ تانل وایرگارد (WireGuard Configurator):</strong></a>
            تولید محلی کلیدهای Curve25519 درون مرورگر، ساخت کانفیگ سرور wg0.conf، کیو‌آرکد موبایل و قوانین فورواردینگ فایروال.
          </li>
          <li>
            <a href="/?tool=subnet"><strong>محاسبه‌گر ساب‌نت و روتینگ (CIDR Subnet Calculator):</strong></a>
            تفکیک محدوده IP، نت‌ماسک، وایلدکارت و تولید خودکار دستورات ip route add و iptables MASQUERADE لینوکس.
          </li>
          <li>
            <a href="/?tool=routing"><strong>استودیو مسیریابی و فایروال لینوکس (Routing & NAT Studio):</strong></a>
            پیکربندی آسان NAT Gateway (اشتراک اینترنت)، پورت فورواردینگ (DNAT و Hairpin NAT)، ایمن‌سازی داکر با DOCKER-USER و پالیسی روتینگ (Multi-WAN) با سینتکس همزمان iptables و nftables.
          </li>
        </ul>
