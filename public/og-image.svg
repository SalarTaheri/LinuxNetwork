<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="1050" cy="120" r="280" fill="#10b981" opacity="0.08" filter="url(#glow)" />
  <circle cx="150" cy="520" r="240" fill="#06b6d4" opacity="0.07" filter="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Terminal Top Bar Window decoration -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="7" fill="#ef4444" />
    <circle cx="22" cy="0" r="7" fill="#f59e0b" />
    <circle cx="44" cy="0" r="7" fill="#10b981" />
    <text x="70" y="5" fill="#64748b" font-family="monospace" font-size="14" font-weight="600">terminal@linuxnetwork.ir: ~</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(60, 150)">
    <!-- Terminal Icon -->
    <rect x="0" y="0" width="68" height="68" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2" />
    <path d="M 20 22 L 32 34 L 20 46" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="36" y1="46" x2="48" y2="46" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />

    <text x="88" y="46" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      LinuxNetwork<tspan fill="#10b981">.ir</tspan>
    </text>
    <rect x="425" y="16" width="96" height="30" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="473" y="36" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">v2.4 LTS</text>
  </g>

  <!-- Headline -->
  <text x="60" y="270" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">
    Linux Network &amp; Kernel Tuning Toolbox
  </text>
  <text x="60" y="315" fill="#94a3b8" font-family="'Vazirmatn', system-ui, sans-serif" font-size="22" font-weight="500">
    جعبه ابزار جامع بهینه‌سازی شبکه لینوکس، کرنل Sysctl، انجین‌ایکس، وایرگارد و سابنت
  </text>

  <!-- Tool Features Pills Grid -->
  <g transform="translate(60, 370)">
    <!-- Feature 1: setup.sh -->
    <g transform="translate(0, 0)">
      <rect width="250" height="95" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="30" r="14" fill="#10b981" fill-opacity="0.2" />
      <text x="28" y="35" fill="#10b981" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">&gt;_</text>
      <text x="52" y="34" fill="#f1f5f9" font-family="monospace" font-size="16" font-weight="700">setup.sh</text>
      <text x="20" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">One-liner Server Hardening</text>
    </g>

    <!-- Feature 2: Sysctl BBR -->
    <g transform="translate(270, 0)">
      <rect width="250" height="95" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="30" r="14" fill="#06b6d4" fill-opacity="0.2" />
      <text x="28" y="35" fill="#06b6d4" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">⚡</text>
      <text x="52" y="34" fill="#f1f5f9" font-family="monospace" font-size="16" font-weight="700">Sysctl &amp; BBR</text>
      <text x="20" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">TCP &amp; Kernel Buffer Tuning</text>
    </g>

    <!-- Feature 3: Nginx Reverse Proxy -->
    <g transform="translate(540, 0)">
      <rect width="250" height="95" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="30" r="14" fill="#3b82f6" fill-opacity="0.2" />
      <text x="28" y="35" fill="#3b82f6" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">🌐</text>
      <text x="52" y="34" fill="#f1f5f9" font-family="monospace" font-size="16" font-weight="700">Nginx Proxy</text>
      <text x="20" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">WebSocket &amp; SSL Configs</text>
    </g>

    <!-- Feature 4: WireGuard & Subnet -->
    <g transform="translate(810, 0)">
      <rect width="270" height="95" rx="14" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.2" />
      <circle cx="28" cy="30" r="14" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="28" y="35" fill="#8b5cf6" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">🛡️</text>
      <text x="52" y="34" fill="#f1f5f9" font-family="monospace" font-size="16" font-weight="700">WireGuard &amp; CIDR</text>
      <text x="20" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Curve25519 &amp; Routing Tool</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(60, 530)">
    <rect width="1080" height="42" rx="10" fill="#0c121e" stroke="#1e293b" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#10b981" />
    <text x="38" y="26" fill="#34d399" font-family="monospace" font-size="13" font-weight="600">curl -fsSL https://linuxnetwork.ir/setup.sh | sudo bash</text>
    <text x="1050" y="26" fill="#64748b" font-family="monospace" font-size="12" text-anchor="end">100% Client-Side Private • Zero Tracking</text>
  </g>
</svg>
