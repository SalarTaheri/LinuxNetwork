<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="fav-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="url(#fav-bg)" stroke="#10b981" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Terminal Prompt Chevron '>' -->
  <path d="M 18 20 L 32 32 L 18 44" fill="none" stroke="url(#fav-emerald)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Terminal Cursor '_' -->
  <line x1="36" y1="44" x2="48" y2="44" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
  
  <!-- Subtle Glowing Corner Accent -->
  <circle cx="52" cy="14" r="3" fill="#10b981" opacity="0.9" />
</svg>
